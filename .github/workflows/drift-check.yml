name: Drift Check

on:
  workflow_dispatch:
    inputs:
      correlation_id:
        description: "Correlation ID generated by the MSP platform"
        required: false
        default: "manual"

permissions:
  id-token: write
  contents: read

env:
  TF_WORKING_DIR: msp-sandbox-infra/infra
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (Access Key / Session Token or OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          role-to-assume: ${{ secrets.AWS_ACCESS_KEY_ID == '' && secrets.AWS_CI_ROLE_ARN || '' }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Read state metadata (serial & lineage only, no values)
        id: state_meta
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform state pull | python3 -c '
          import json, sys
          s = json.load(sys.stdin)
          print("serial={}".format(s.get("serial", "")))
          print("lineage={}".format(s.get("lineage", "")))
          ' >> "$GITHUB_OUTPUT"

      - name: Terraform Refresh-Only Plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set +e
          terraform plan -refresh-only -detailed-exitcode -input=false -no-color -var="aws_region=${{ env.AWS_REGION }}" -out=drift.tfplan
          CODE=$?
          echo "exitcode=$CODE" >> "$GITHUB_OUTPUT"
          if [ "$CODE" -eq 1 ]; then
            exit 1
          fi
          terraform show -json drift.tfplan > plan.raw.json

      - name: Redact plan and extract metadata
        id: report
        env:
          PYTHONPATH: ${{ github.workspace }}/msp-sandbox-infra/scripts
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"
          mkdir -p out
          python3 -m msp_policy redact \
            --in "${{ env.TF_WORKING_DIR }}/plan.raw.json" \
            --out out/plan.redacted.json
          python3 -m msp_policy meta \
            --plan out/plan.redacted.json \
            --out out/meta.json \
            --workflow drift-check \
            --correlation-id "${{ inputs.correlation_id || github.run_id }}" \
            --commit "${{ github.sha }}" \
            --ref "${{ github.ref }}" \
            --run-id "${{ github.run_id }}" \
            --root-dir "${{ env.TF_WORKING_DIR }}" \
            --account-id "$ACCOUNT_ID" \
            --region "${{ env.AWS_REGION }}" \
            --state-serial "${{ steps.state_meta.outputs.serial }}" \
            --state-lineage "${{ steps.state_meta.outputs.lineage }}"
          python3 -m msp_policy drift \
            --plan out/plan.redacted.json \
            --out out/drift.json

      - name: Store redacted drift report in S3
        env:
          ACCOUNT_ID: ${{ steps.report.outputs.account_id }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          files = ("plan.redacted.json", "meta.json", "drift.json")
          output = Path("out")
          report = {name: json.loads((output / name).read_text(encoding="utf-8")) for name in files}
          if report["plan.redacted.json"].get("msp_redacted") is not True:
              raise SystemExit("The drift plan must be redacted before upload")
          with (output / "report.json").open("w", encoding="utf-8") as file:
              json.dump(report, file, separators=(",", ":"))
          PY
          aws s3api put-object \
            --bucket "msp-drift-reports-${ACCOUNT_ID}-${AWS_REGION}" \
            --expected-bucket-owner "$ACCOUNT_ID" \
            --key "drift-reports/${GITHUB_REPOSITORY,,}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}.json" \
            --body out/report.json \
            --content-type application/json \
            --no-cli-pager > /dev/null
