name: Destroy Sandbox Infrastructure
run-name: Destroy Sandbox (${{ inputs.stack || 'ec2' }})

on:
  workflow_dispatch:
    inputs:
      stack:
        description: "Sandbox Terraform folder to destroy (destroy ec2 and database before networking)"
        required: true
        default: "ec2"
        type: choice
        options:
          - ec2
          - database
          - networking
          - legacy
      confirm:
        description: "Type 'destroy' (or 'destroy <stack>') to confirm removing resources"
        required: true
        default: "destroy"

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-sandbox-${{ inputs.stack || 'ec2' }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  STACK: ${{ inputs.stack || 'ec2' }}

jobs:
  destroy:
    name: Destroy ${{ inputs.stack || 'ec2' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation & resolve folder
        id: target
        run: |
          if [[ "${{ inputs.confirm }}" != "destroy" && "${{ inputs.confirm }}" != "destroy $STACK" ]]; then
            echo "Confirmation must be 'destroy' or 'destroy $STACK'. Aborting." >&2
            exit 1
          fi
          case "$STACK" in
            networking|ec2|database) echo "dir=msp-sandbox-infra/stacks/$STACK" >> "$GITHUB_OUTPUT" ;;
            legacy) echo "dir=msp-sandbox-infra/infra" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unsupported stack: $STACK" >&2; exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (Access Key / Session Token or OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          role-to-assume: ${{ secrets.AWS_ACCESS_KEY_ID == '' && secrets.AWS_CI_ROLE_ARN || '' }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ${{ steps.target.outputs.dir }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Check that networking has no dependent ENIs
        if: inputs.stack == 'networking'
        working-directory: ${{ steps.target.outputs.dir }}
        run: |
          vpc_id=$(terraform output -json | jq -er '.vpc_id.value // ""')
          if [[ -n "$vpc_id" ]]; then
            enis=$(aws ec2 describe-network-interfaces \
              --filters "Name=vpc-id,Values=$vpc_id" \
              --query 'length(NetworkInterfaces)' --output json --no-cli-pager)
            if [[ "$enis" != 0 ]]; then
              echo "Networking VPC $vpc_id still has $enis attached ENI(s). Destroy ec2 and database stacks first." >&2
              exit 1
            fi
          fi

      - name: Terraform Destroy
        working-directory: ${{ steps.target.outputs.dir }}
        run: |
          terraform destroy -input=false -auto-approve -no-color -var="aws_region=${{ env.AWS_REGION }}"
          echo "### Sandbox Stack Removed: \`${{ steps.target.outputs.dir }}\`" >> "$GITHUB_STEP_SUMMARY"
