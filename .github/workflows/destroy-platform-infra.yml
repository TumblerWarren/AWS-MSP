name: Destroy Platform AWS Infrastructure

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'destroy' to confirm removing all platform AWS resources"
        required: true
        default: "destroy"

permissions:
  id-token: write
  contents: read

env:
  TF_WORKING_DIR: msp-platform/infra
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  destroy:
    name: Destroy All Platform AWS Infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "destroy" ]; then
            echo "Confirmation input must be 'destroy'. Aborting."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Terraform Init & Destroy
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          terraform destroy -input=false -auto-approve \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="state_bucket_arn=arn:aws:s3:::${{ vars.TF_STATE_BUCKET }}"
          echo "### All Platform AWS Infrastructure Removed" >> "$GITHUB_STEP_SUMMARY"
