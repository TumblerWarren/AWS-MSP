name: PR Terraform Plan & Policy Gate

on:
  pull_request:
    paths:
      - "msp-sandbox-infra/stacks/**"
      - "msp-sandbox-infra/infra/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}

jobs:
  detect:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      roots: ${{ steps.changed.outputs.roots }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, subprocess
          base = os.environ["GITHUB_BASE_REF"]
          diff = subprocess.check_output(["git", "diff", "--name-only", f"origin/{base}...HEAD"], text=True).splitlines()
          candidates = [
              "msp-sandbox-infra/stacks/networking",
              "msp-sandbox-infra/stacks/ec2",
              "msp-sandbox-infra/stacks/database",
              "msp-sandbox-infra/infra",
          ]
          hit = [root for root in candidates if any(path.startswith(root + "/") for path in diff)]
          print("roots=" + json.dumps(hit))
          PY

  plan-and-gate:
    needs: detect
    if: needs.detect.outputs.roots != '[]' && needs.detect.outputs.roots != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root_dir: ${{ fromJson(needs.detect.outputs.roots) }}
    env:
      TF_WORKING_DIR: ${{ matrix.root_dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (Access Key / Session Token or OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          role-to-assume: ${{ secrets.AWS_ACCESS_KEY_ID == '' && secrets.AWS_CI_ROLE_ARN || '' }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Terraform Format Check & Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform fmt -check -recursive
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ env.AWS_REGION }}"
          terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan -input=false -no-color -var="aws_region=${{ env.AWS_REGION }}" -out=pr.tfplan
          terraform show -json pr.tfplan > plan.raw.json

      - name: Determine gate mode (update for drift-fix PRs, apply otherwise)
        id: mode
        env:
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          if [[ "$PR_BRANCH" == msp/drift-fix-* ]]; then
            echo "gate_mode=update" >> "$GITHUB_OUTPUT"
          else
            echo "gate_mode=apply" >> "$GITHUB_OUTPUT"
          fi

      - name: Redact plan & run deterministic policy gate
        id: gate
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}/msp-sandbox-infra/scripts
        run: |
          mkdir -p out
          python3 -m msp_policy redact \
            --in "${{ env.TF_WORKING_DIR }}/plan.raw.json" \
            --out out/plan.redacted.json
          echo "## Stack: \`${{ env.TF_WORKING_DIR }}\`" > out/summary.md
          python3 -m msp_policy gate \
            --plan out/plan.redacted.json \
            --mode "${{ steps.mode.outputs.gate_mode }}" \
            --out out/policy.json \
            --markdown out/summary.md
          cat out/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment policy summary on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('out/summary.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail job if policy gate blocked
        if: steps.gate.outcome != 'success'
        run: exit 1
