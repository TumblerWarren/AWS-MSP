name: PR Terraform Plan & Policy Gate

on:
  pull_request:
    paths:
      - "msp-sandbox-infra/infra/**"
      - "infra/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_WORKING_DIR: msp-sandbox-infra/infra
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}

jobs:
  plan-and-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Terraform Format Check & Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform fmt -check -recursive
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ env.AWS_REGION }}"
          terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan -input=false -no-color -var="aws_region=${{ env.AWS_REGION }}" -out=pr.tfplan
          terraform show -json pr.tfplan > plan.raw.json

      - name: Determine gate mode (update for drift-fix PRs, apply otherwise)
        id: mode
        run: |
          BRANCH="${{ github.head_ref }}"
          if [[ "$BRANCH" == msp/drift-fix-* ]]; then
            echo "gate_mode=update" >> "$GITHUB_OUTPUT"
          else
            echo "gate_mode=apply" >> "$GITHUB_OUTPUT"
          fi

      - name: Redact plan & run deterministic policy gate
        id: gate
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}/msp-sandbox-infra/scripts
        run: |
          mkdir -p out
          python3 -m msp_policy redact \
            --in "${{ env.TF_WORKING_DIR }}/plan.raw.json" \
            --out out/plan.redacted.json
          python3 -m msp_policy gate \
            --plan out/plan.redacted.json \
            --mode "${{ steps.mode.outputs.gate_mode }}" \
            --out out/policy.json \
            --markdown out/summary.md
          cat out/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment policy summary on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('out/summary.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Upload redacted PR plan & policy result
        uses: actions/upload-artifact@v4
        with:
          name: pr-plan-${{ github.event.pull_request.number }}
          path: |
            out/plan.redacted.json
            out/policy.json
          retention-days: 14

      - name: Fail job if policy gate blocked
        if: steps.gate.outcome != 'success'
        run: exit 1
