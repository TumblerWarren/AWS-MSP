name: Deploy Sandbox Infrastructure
run-name: Deploy Sandbox (${{ inputs.stack || 'networking' }})

on:
  workflow_dispatch:
    inputs:
      stack:
        description: "Sandbox Terraform folder to deploy (deploy networking first, then ec2 and database)"
        required: true
        default: "networking"
        type: choice
        options:
          - networking
          - ec2
          - database
          - legacy

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-sandbox-${{ inputs.stack || 'networking' }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  STACK: ${{ inputs.stack || 'networking' }}

jobs:
  deploy:
    name: Deploy ${{ inputs.stack || 'networking' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Terraform folder
        id: target
        run: |
          case "$STACK" in
            networking|ec2|database) echo "dir=msp-sandbox-infra/stacks/$STACK" >> "$GITHUB_OUTPUT" ;;
            legacy) echo "dir=msp-sandbox-infra/infra" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unsupported stack: $STACK" >&2; exit 1 ;;
          esac

      - name: Configure AWS credentials (Access Key / Session Token or OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          role-to-assume: ${{ secrets.AWS_ACCESS_KEY_ID == '' && secrets.AWS_CI_ROLE_ARN || '' }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Terraform Init & Validate
        working-directory: ${{ steps.target.outputs.dir }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ env.AWS_REGION }}"
          terraform validate

      - name: Terraform Plan & Apply
        working-directory: ${{ steps.target.outputs.dir }}
        run: |
          terraform plan -input=false -no-color -var="aws_region=${{ env.AWS_REGION }}" -out=tfplan
          terraform apply -input=false -auto-approve -no-color tfplan
          {
            echo "### Sandbox Stack Deployed: \`${{ steps.target.outputs.dir }}\`"
            echo '```json'
            terraform output -json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
