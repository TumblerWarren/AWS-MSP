name: Restore AWS from Terraform
run-name: Restore ${{ inputs.correlation_id }}

on:
  workflow_dispatch:
    inputs:
      finding_id:
        description: Primary MSP finding ID
        type: string
        required: true
      correlation_id:
        description: MSP restore request ID
        type: string
        required: true
      allowed_addresses:
        description: JSON array of resource instances reviewed for restore
        type: string
        required: true
      expected_drift_hash:
        description: Reviewed drift evidence hash
        type: string
        required: true
      expected_commit:
        description: Reviewed Terraform commit
        type: string
        required: true
      expected_account:
        description: Reviewed AWS account
        type: string
        required: true
      expected_region:
        description: Reviewed AWS region
        type: string
        required: true
      expected_root:
        description: Reviewed Terraform root folder
        type: string
        required: true
      expected_lineage:
        description: Reviewed Terraform state lineage
        type: string
        required: true
      expected_serial:
        description: Reviewed Terraform state serial
        type: string
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-workspace-restore-${{ inputs.expected_root }}
  cancel-in-progress: false

env:
  TF_WORKING_DIR: ${{ inputs.expected_root }}
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  PYTHONPATH: ${{ github.workspace }}/msp-sandbox-infra/scripts
  ALLOWED_ADDRESSES: ${{ inputs.allowed_addresses }}
  EXPECTED_DRIFT_HASH: ${{ inputs.expected_drift_hash }}
  EXPECTED_COMMIT: ${{ inputs.expected_commit }}
  EXPECTED_ACCOUNT: ${{ inputs.expected_account }}
  EXPECTED_REGION: ${{ inputs.expected_region }}
  EXPECTED_ROOT: ${{ inputs.expected_root }}
  EXPECTED_LINEAGE: ${{ inputs.expected_lineage }}
  EXPECTED_SERIAL: ${{ inputs.expected_serial }}

jobs:
  plan-and-gate:
    name: Plan & Deterministic Policy Gate
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.save.outputs.key }}
      sha: ${{ steps.save.outputs.sha }}
    steps:
      - name: Validate target Terraform folder
        run: |
          case "$TF_WORKING_DIR" in
            msp-sandbox-infra/stacks/networking|msp-sandbox-infra/stacks/ec2|msp-sandbox-infra/stacks/database|msp-sandbox-infra/infra) ;;
            *) echo "Unsupported expected_root: $TF_WORKING_DIR" >&2; exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (Access Key / Session Token or OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          role-to-assume: ${{ secrets.AWS_ACCESS_KEY_ID == '' && secrets.AWS_CI_ROLE_ARN || '' }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate workspace and generate full plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=$AWS_REGION"
          python3 -m msp_policy.workspace check
          terraform plan -input=false -no-color -out=restore.tfplan
          python3 -m msp_policy.workspace check
          terraform show -json restore.tfplan > plan.raw.json
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}

      - name: Gate and review the full plan
        id: gate
        run: |
          mkdir -p out
          python3 -m msp_policy redact --in "$TF_WORKING_DIR/plan.raw.json" --out out/plan.redacted.json
          python3 -m msp_policy gate --plan out/plan.redacted.json --mode restore \
            --allowed "$ALLOWED_ADDRESSES" --expected-drift-hash "$EXPECTED_DRIFT_HASH" \
            --expected-commit "$EXPECTED_COMMIT" --actual-commit "$GITHUB_SHA" \
            --out out/policy.json --markdown "$GITHUB_STEP_SUMMARY"
          python3 -m msp_policy.workspace review out/plan.redacted.json >> "$GITHUB_STEP_SUMMARY"

      - name: Store the approved candidate plan in private S3
        id: save
        run: |
          file="$TF_WORKING_DIR/restore.tfplan"
          bucket="msp-drift-reports-$EXPECTED_ACCOUNT-$AWS_REGION"
          key="restore-plans/${GITHUB_REPOSITORY,,}/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT.tfplan"
          aws s3api put-object --bucket "$bucket" --expected-bucket-owner "$EXPECTED_ACCOUNT" \
            --key "$key" --body "$file" --no-cli-pager >/dev/null
          echo "sha=$(sha256sum "$file" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"

  apply:
    name: Apply Approved Restore Plan
    needs: plan-and-gate
    if: vars.MSP_ENABLE_RESTORE != 'false'
    runs-on: ubuntu-latest
    environment: sandbox
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (Access Key / Session Token or OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          role-to-assume: ${{ secrets.AWS_ACCESS_KEY_ID == '' && secrets.AWS_CI_ROLE_ARN || '' }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recheck current evidence and apply the reviewed plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          REVIEWED_KEY: ${{ needs.plan-and-gate.outputs.key }}
          REVIEWED_SHA: ${{ needs.plan-and-gate.outputs.sha }}
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
        run: |
          terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=$AWS_REGION"
          python3 -m msp_policy.workspace check
          bucket="msp-drift-reports-$EXPECTED_ACCOUNT-$AWS_REGION"
          aws s3api get-object --bucket "$bucket" --expected-bucket-owner "$EXPECTED_ACCOUNT" \
            --key "$REVIEWED_KEY" --no-cli-pager restore.tfplan >/dev/null
          echo "$REVIEWED_SHA  restore.tfplan" | sha256sum -c
          terraform plan -input=false -no-color -out=fresh.tfplan
          terraform show -json restore.tfplan > reviewed.json
          terraform show -json fresh.tfplan > fresh.json
          python3 -m msp_policy.workspace compare reviewed.json fresh.json
          python3 -m msp_policy.workspace check
          terraform apply -input=false -no-color restore.tfplan

  verify:
    name: Verify Restored Resources
    needs: apply
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (Access Key / Session Token or OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          role-to-assume: ${{ secrets.AWS_ACCESS_KEY_ID == '' && secrets.AWS_CI_ROLE_ARN || '' }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify the restored resources with a fresh full plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
        run: |
          terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=$AWS_REGION"
          terraform plan -input=false -no-color -out=verification.tfplan
          terraform show -json verification.tfplan > verification.json
          python3 -m msp_policy.workspace verify verification.json >> "$GITHUB_STEP_SUMMARY"
