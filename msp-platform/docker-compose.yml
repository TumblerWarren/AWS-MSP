services:
  msp-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: msp-platform
    ports:
      - "8080:8080"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Persist SQLite DB in the mounted /data volume
      MSP_DATABASE_URL: sqlite:////data/msp.db
      MSP_LOCAL_INFRA_REPO_PATH: /workspace/msp-sandbox-infra
      MSP_AWS_REGION: ${MSP_AWS_REGION:-ap-south-1}
      MSP_INVESTIGATOR_ROLE_ARN: ${MSP_INVESTIGATOR_ROLE_ARN:-}
      MSP_GITHUB_REPO: ${MSP_GITHUB_REPO:-TumblerWarren/AWS-MSP}
      MSP_TERRAFORM_ROOTS: ${MSP_TERRAFORM_ROOTS:-["msp-sandbox-infra/stacks/networking","msp-sandbox-infra/stacks/ec2","msp-sandbox-infra/stacks/database"]}
      MSP_GITHUB_TOKEN: ${MSP_GITHUB_TOKEN:-}
      MSP_STRANDS_MODEL_ID: ${MSP_STRANDS_MODEL_ID:-au.anthropic.claude-sonnet-4-6}
      MSP_CLAUDE_USE_BEDROCK: ${MSP_CLAUDE_USE_BEDROCK:-true}
      MSP_CLAUDE_MODEL: ${MSP_CLAUDE_MODEL:-au.anthropic.claude-sonnet-4-6}
      MSP_AWS_MCP_ENABLED: ${MSP_AWS_MCP_ENABLED:-true}
      # Temporary AWS credentials passed from host environment or backend/.env
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${MSP_AWS_REGION:-ap-south-1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - msp-data:/data
      - ../msp-sandbox-infra:/workspace/msp-sandbox-infra:ro
    restart: unless-stopped

volumes:
  msp-data:
