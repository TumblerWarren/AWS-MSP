[project]
name = "msp-backend"
version = "0.1.0"
description = "AWS AI Infrastructure Drift Investigation & Reconciliation Platform (MVP 1)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "boto3>=1.36.0",
    "claude-agent-sdk>=0.1.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "mcp>=1.6.0",
    "msp-policy",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlmodel>=0.0.22",
    "strands-agents>=1.0.0",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[tool.uv.sources]
msp-policy = { path = "../packages/msp_policy", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
